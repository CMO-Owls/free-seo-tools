[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmoowls-seo-tools"
version = "1.0.0"
description = "Free SEO and AI-visibility checks: robots.txt and AI crawler access, llms.txt, sitemaps, schema, broken links, redirects, meta tags, mobile and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CMO Owls", email = "hello@cmoowls.com" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.25", "Pillow>=10"]
keywords = ["seo", "ai visibility", "llms.txt", "robots.txt", "sitemap", "schema", "broken links", "geo", "aeo"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://www.cmoowls.com/tools/"
Source = "https://github.com/CMO-Owls/free-seo-tools"
Issues = "https://github.com/CMO-Owls/free-seo-tools/issues"

[project.scripts]
cmoowls-seo = "cmoowls_seo_tools.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]
